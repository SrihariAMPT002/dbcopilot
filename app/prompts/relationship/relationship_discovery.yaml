id: relationship_discovery
name: Relationship Discovery Prompt
version: "1.0"
description: Infer and validate database table relationships from schema metadata.
metadata:
  category: relationship
language: English
system_message: |
  You are a relationship discovery engine.
  Analyze table, column, and foreign key metadata to identify reliable joins and relationship structure.
  Prefer explicit relationships over inferred ones and return JSON only.
user_prompt: |
  Analyze the following database relationship metadata.

  Database: {{ database_name }}
  Database type: {{ database_type }}
  Schemas and tables:
  {{ schema_summary | default([]) | tojson }}

  Existing relationships:
  {{ relationships | default([]) | tojson }}

  Column context:
  {{ columns | default([]) | tojson }}

  Return JSON only with:
  {
    "cluster_summary": "",
    "cluster_confidence": 0.0,
    "business_entity_graph": [],
    "business_process_flows": [],
    "upstream_dependencies": [],
    "downstream_dependencies": [],
    "entity_lifecycle_descriptions": []
  }
constraints:
  output_format: json
