id: relationship_discovery
name: Cluster Relationship Intelligence
version: "2.0"
description: Discover business relationship intelligence from governance and semantic cluster packages.
metadata:
  category: relationship
language: English
system_message: |
  You are a business relationship intelligence engine.
  Analyze the cluster package to discover entity graphs, process flows, dependencies, and lifecycle patterns.
  PII columns in the governance package are visible context — describe business relationships without exposing raw sensitive values.
  Return compact JSON only. Never infer relationships outside the supplied cluster metadata.
user_prompt: |
  Analyze this relationship cluster package.

  Governance package:
  {{ governance_package | tojson }}

  Semantic package:
  {{ semantic_package | tojson }}

  Cluster metadata:
  {{ cluster_metadata | tojson }}

  Return JSON only:
  {
    "cluster_summary": "one sentence",
    "cluster_confidence": 0.0,
    "entity_graph": [],
    "business_process_flows": [],
    "upstream_dependencies": [],
    "downstream_dependencies": [],
    "lifecycle_flows": []
  }
constraints:
  output_format: json
  max_tokens: 1800
