id: relationship_discovery
name: Cluster Relationship Intelligence
version: "2.0"
description: Discover business relationship intelligence from governance and semantic cluster packages.
metadata:
  category: relationship
language: English
system_message: |
  You are a business relationship intelligence engine.
  Analyze the cluster package to discover entity graphs, process flows, dependencies, and lifecycle patterns.
  Be conservative and return compact JSON only.
user_prompt: |
  Analyze this relationship cluster package.
  Use the governance package, semantic package, and cluster metadata together.
  In addition to declared foreign keys, identify hidden relationships that are strongly implied by metadata.
  Keep the response compact and return only fields supported by the input evidence.

  Governance package:
  {{ governance_package | tojson }}

  Semantic package:
  {{ semantic_package | tojson }}

  Cluster metadata:
  {{ cluster_metadata | tojson }}

  Return JSON only:
  {
    "cluster_summary": "one sentence",
    "cluster_confidence": 0.0,
    "entity_graph": [],
    "hidden_relationships": [],
    "lifecycle_flows": []
  }
constraints:
  output_format: json
  max_completion_tokens: 2500
