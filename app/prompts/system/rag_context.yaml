# Prompt Studio artifact template for RAG context.

id: rag_context
name: "RAG Context"
description: "Markdown retrieval context combining semantic, graph, and embedding signals."
version: 1.0
language: English

user_prompt: |
  # RAG Context

  ## Database
  - Name: {{ database_name }}
  - Type: {{ database_type }}

  ## Retrieval Goal
  Use the following database context to answer questions with grounded schema context.

  ## Semantic Summary
  {{ semantic.business_summary or 'Not available' }}

  ## Strong Retrieval Signals
  {% if semantic.key_entities %}
  {% for item in semantic.key_entities[:8] %}
  - Entity: {{ item }}
  {% endfor %}
  {% endif %}

  {% if relationship_graph and relationship_graph.edges %}
  ## Relationship Hints
  {% for edge in relationship_graph.edges[:15] %}
  - {{ edge.source_schema_name }}.{{ edge.source_table_name }} -> {{ edge.target_schema_name }}.{{ edge.target_table_name }}
  {% endfor %}
  {% endif %}

  ## Embedding Index
  - Indexed tables: {{ embeddings.indexed_tables }}
  - Vector count: {{ embeddings.vector_count }}
  - Collections: {{ embeddings.collection_names | join(', ') }}

  ## Retrieval Guidance
  - Prefer the most similar table-level or relationship-level context.
  - Use prompt context only when it improves grounding.
  - Keep explanations concise and specific.

constraints:
  max_completion_tokens: 0

metadata:
  category: "system"
  audience: "prompt_studio"
