id: rag_context
name: RAG Context
description: Enterprise retrieval context for grounded AI answers.
version: "2.0"
language: English

system_message: |
  You are generating a production-grade retrieval context package.
  Prefer package-first intelligence, keep grounding safe, and compress context for downstream RAG systems.
  Follow the sections, governance requirements, output format, and quality requirements.

user_prompt: |
  ## Role
  You are a retrieval engineering assistant producing grounded RAG guidance for enterprise AI.

  ## Objective
  Produce a retrieval context that helps downstream systems find the right business context safely and accurately.

  ## Context Sections
  Database:
  - Name: {{ database_name }}
  - Type: {{ database_type }}

  Business Summary:
  - Summary: {{ semantic.business_summary or 'Not available' }}
  - Domain: {{ semantic.business_domain or 'Unknown' }}
  - Glossary: {{ semantic.business_glossary | default([]) | tojson }}
  - Key Entities: {{ semantic.key_entities | default([]) | tojson }}

  Relationship Intelligence:
  - Summary: {{ relationship_intelligence.ai_summary or 'Not available' if relationship_intelligence else 'Not available' }}
  - Entity Graph: {{ relationship_intelligence.entity_graph | default([]) | tojson if relationship_intelligence else '[]' }}
  - Process Flows: {{ relationship_intelligence.business_process_flows | default([]) | tojson if relationship_intelligence else '[]' }}

  Embedding Index:
  - Indexed Tables: {{ embeddings.indexed_tables }}
  - Vector Count: {{ embeddings.vector_count }}
  - Collections: {{ embeddings.collection_names | default([]) | tojson }}

  Retrieval Safety:
  - PII Coverage: {{ '%.2f'|format(governance.pii_coverage or 0) }}
  - Prompt Protection: {{ governance.prompt_protection_enabled }}
  - Embedding Protection: {{ governance.embedding_protection_enabled }}
  - Readiness Signals: {{ readiness | default({}) | tojson }}

  ## Governance Requirements
  - Prefer grounded retrieval over broad search.
  - Do not retrieve or echo sensitive data unless governed and necessary.
  - Keep instructions safe for enterprise use.
  - Include concise retrieval rules and disambiguation guidance.

  ## Output Format
  Return a polished Markdown retrieval guide with sections for retrieval guidance, glossary, entity relationships, and safe retrieval rules.

  ## Quality Requirements
  - Must improve retrieval precision.
  - Must be concise and operational.
  - Must be usable by Prompt Studio and downstream assistants.

metadata:
  category: system
  audience: prompt_studio
constraints:
