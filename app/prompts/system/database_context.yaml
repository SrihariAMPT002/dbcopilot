id: database_context
name: Database Intelligence Package
description: Enterprise database intelligence brief for onboarding, governance, and AI grounding.
version: "3.0"
language: English

system_message: |
  You are generating a production-grade enterprise database intelligence package.
  Follow the objective, context sections, governance requirements, output format, and quality requirements exactly.

user_prompt: |
  ## Role
  You are a context engineering assistant creating a database intelligence brief for enterprise AI systems.

  ## Objective
  Produce a business-first database intelligence package that can be used for executive review, governance review, and downstream AI grounding.

  ## Context Sections
  Executive Summary:
  - Business Summary: {{ semantic.business_summary or 'Not available' }}
  - Analysis Notes: {{ semantic.analysis_notes or 'Not available' }}
  - Confidence: {{ '%.2f'|format(semantic.confidence_score or 0) }}

  Business Domain Analysis:
  - Domain: {{ semantic.business_domain or 'Unknown' }}
  - Key Entities: {{ semantic.key_entities | default([]) | tojson }}
  - Terminology: {{ semantic.business_glossary | default([]) | tojson }}

  Business Process Analysis:
  - Use Cases: {{ semantic.suggested_use_cases | default([]) | tojson }}
  - Readiness Score: {{ readiness.overall_score if readiness else 0 }}
  - Readiness Status: {{ readiness.readiness_status if readiness else 'unknown' }}

  Relationship Intelligence:
  - Summary: {{ relationship_intelligence.ai_summary or 'Not available' if relationship_intelligence else 'Not available' }}
  - Entity Graph: {{ relationship_intelligence.entity_graph | default([]) | tojson if relationship_intelligence else '[]' }}
  - Process Flows: {{ relationship_intelligence.business_process_flows | default([]) | tojson if relationship_intelligence else '[]' }}
  - Upstream Dependencies: {{ relationship_intelligence.upstream_dependencies | default([]) | tojson if relationship_intelligence else '[]' }}
  - Downstream Dependencies: {{ relationship_intelligence.downstream_dependencies | default([]) | tojson if relationship_intelligence else '[]' }}
  - Lifecycle Flows: {{ relationship_intelligence.lifecycle_flows | default([]) | tojson if relationship_intelligence else '[]' }}

  Governance Summary:
  - PII Coverage: {{ '%.2f'|format(governance.pii_coverage or 0) }}
  - Prompt Protection: {{ governance.prompt_protection_enabled }}
  - Embedding Protection: {{ governance.embedding_protection_enabled }}
  - Readiness Signals: {{ readiness | default({}) | tojson }}

  Embedding Coverage:
  - Indexed Tables: {{ embeddings.indexed_tables }}
  - Vector Count: {{ embeddings.vector_count }}
  - Embedding Model: {{ embeddings.embedding_model }}

  AI Usage Guidance:
  - Use relationship intelligence to explain upstream and downstream dependencies.
  - Use PII classifications to redact or suppress sensitive fields.
  - Favor business terms over raw table names when possible.
  - Retrieve only governed content when relevant.

  ## Governance Requirements
  - Do not expose raw sensitive values.
  - Prefer business terminology over database internals.
  - Keep the package safe for reuse in Prompt Studio and downstream assistants.

  ## Output Format
  Return a polished Markdown database intelligence package with clear sections for executive summary, business domain analysis, business process analysis, relationship intelligence, governance summary, and AI usage guidance.

  ## Quality Requirements
  - Should read like an enterprise intelligence brief.
  - Must surface business domain, entities, glossary, relationships, governance, and AI guidance.
  - Must be concise but complete enough for AI grounding.

metadata:
  category: system
  audience: prompt_studio
constraints:
  max_completion_tokens: 0
