# Prompt Studio artifact template for a database context package.

id: database_context
name: "Database Context Package"
description: "Markdown context package combining metadata, semantic intelligence, graph signals, and embedding status."
version: 1.0
language: English

user_prompt: |
  # Database Context Package

  ## Database
  - Name: {{ database_name }}
  - Type: {{ database_type }}
  - Schemas: {{ schema_count }}
  - Tables: {{ table_count }}
  - Columns: {{ column_count }}
  - Relationships: {{ relationship_count }}
  - Generated At: {{ generated_at }}

  ## Semantic Intelligence
  - Business Domain: {{ semantic.business_domain or 'Unknown' }}
  - Business Summary: {{ semantic.business_summary or 'Not available' }}
  - Analysis Notes: {{ semantic.analysis_notes or 'Not available' }}
  - Confidence Score: {{ '%.2f'|format(semantic.confidence_score or 0) }}
  - Generation Status: {{ semantic.generation_status or 'not_generated' }}

  ## Key Entities
  {% if semantic.key_entities %}
  {% for item in semantic.key_entities %}
  - {{ item }}
  {% endfor %}
  {% else %}
  - None detected
  {% endif %}

  ## Business Glossary
  {% if semantic.business_glossary %}
  {% for item in semantic.business_glossary %}
  - {{ item.term if item.term is defined else item.get('term', 'Unknown') }}: {{ item.definition if item.definition is defined else item.get('definition', '') }}
  {% endfor %}
  {% else %}
  - None detected
  {% endif %}

  ## Suggested Use Cases
  {% if semantic.suggested_use_cases %}
  {% for item in semantic.suggested_use_cases %}
  - {{ item }}
  {% endfor %}
  {% else %}
  - None detected
  {% endif %}

  ## Relationship Graph
  - Graph Depth: {{ relationship_graph.metrics.graph_depth if relationship_graph and relationship_graph.metrics else 0 }}
  - Edge Count: {{ relationship_graph.metrics.edge_count if relationship_graph and relationship_graph.metrics else 0 }}
  - Central Tables: {{ relationship_graph.metrics.central_tables | join(', ') if relationship_graph and relationship_graph.metrics and relationship_graph.metrics.central_tables else 'None' }}
  - Isolated Tables: {{ relationship_graph.metrics.isolated_tables | join(', ') if relationship_graph and relationship_graph.metrics and relationship_graph.metrics.isolated_tables else 'None' }}

  {% if relationship_graph and relationship_graph.edges %}
  ### Top Relationships
  {% for edge in relationship_graph.edges[:20] %}
  - {{ edge.source_schema_name }}.{{ edge.source_table_name }} -> {{ edge.target_schema_name }}.{{ edge.target_table_name }} ({{ edge.relationship_type }})
  {% endfor %}
  {% endif %}

  ## Embedding Metadata
  - Indexed Tables: {{ embeddings.indexed_tables }}
  - Vector Count: {{ embeddings.vector_count }}
  - Embedding Model: {{ embeddings.embedding_model }}
  - Qdrant Health: {{ 'Healthy' if embeddings.qdrant_health else 'Unavailable' }}

  ## Table Highlights
  {% for table in tables[:25] %}
  - {{ table.schema_name }}.{{ table.table_name }} | {{ table.table_type }} | status={{ table.semantic_status }} | embedding={{ table.embedding_status }}
  {% endfor %}

constraints:
  max_completion_tokens: 0

metadata:
  category: "system"
  audience: "prompt_studio"
