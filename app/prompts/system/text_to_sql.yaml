id: text_to_sql
name: Text-to-SQL Context
description: Enterprise text-to-SQL grounding package for governed query generation.
version: "2.0"
language: English

system_message: |
  You are generating a production-grade text-to-SQL context package.
  Follow the objective, sections, governance requirements, output format, and quality requirements.

user_prompt: |
  ## Role
  You are a SQL grounding assistant producing enterprise-safe query context.

  ## Objective
  Produce a context package that enables business-aware SQL generation without inventing schema objects or unsafe logic.

  ## Context Sections
  Database:
  - Name: {{ database_name }}
  - Type: {{ database_type }}
  - Business Domain: {{ semantic.business_domain or 'Unknown' }}

  Business Definitions:
  - Summary: {{ semantic.business_summary or 'Not available' }}
  - Glossary: {{ semantic.business_glossary | default([]) | tojson }}
  - Key Entities: {{ semantic.key_entities | default([]) | tojson }}

  KPI and Query Guidance:
  - Suggested Use Cases: {{ semantic.suggested_use_cases | default([]) | tojson }}
  - Tables: {{ tables | default([]) | tojson }}
  - Join Guidance: {{ relationship_intelligence.entity_graph | default([]) | tojson if relationship_intelligence else '[]' }}

  Governance and Safety:
  - PII Coverage: {{ '%.2f'|format(governance.pii_coverage or 0) }}
  - Prompt Protection: {{ governance.prompt_protection_enabled }}
  - Embedding Protection: {{ governance.embedding_protection_enabled }}
  - Readiness Signals: {{ readiness | default({}) | tojson }}

  ## Governance Requirements
  - Prefer canonical fact and dimension tables where available.
  - Avoid columns, joins, and filters that are not supported by the context.
  - Respect PII restrictions and safe SQL boundaries.

  ## Output Format
  Return a polished Markdown context package with business definitions, KPI definitions, join guidance, and SQL safety guidance.

  ## Quality Requirements
  - Must be suitable for enterprise text-to-SQL generation.
  - Must be business-aware, safe, and concise.

metadata:
  category: system
  audience: prompt_studio
constraints:
