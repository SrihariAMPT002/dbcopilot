# Prompt Studio artifact template for Text-to-SQL context.

id: text_to_sql
name: "Text-to-SQL Context"
description: "Markdown context optimized for SQL generation from database metadata."
version: 1.0
language: English

user_prompt: |
  # Text-to-SQL Context

  ## Database
  - Name: {{ database_name }}
  - Type: {{ database_type }}
  - Business Domain: {{ semantic.business_domain or 'Unknown' }}

  ## What this database is about
  {{ semantic.business_summary or 'Not available' }}

  ## Tables to Prefer
  {% for table in tables[:20] %}
  - {{ table.schema_name }}.{{ table.table_name }} ({{ table.table_type }})
  {% endfor %}

  ## Key Fields
  {% for table in tables[:20] %}
  {% if table.relevant_columns %}
  - {{ table.schema_name }}.{{ table.table_name }}: {{ table.relevant_columns | join(', ') }}
  {% endif %}
  {% endfor %}

  ## Joins and Relations
  {% if relationship_graph and relationship_graph.edges %}
  {% for edge in relationship_graph.edges[:20] %}
  - {{ edge.source_schema_name }}.{{ edge.source_table_name }} -> {{ edge.target_schema_name }}.{{ edge.target_table_name }} ({{ edge.relationship_type }})
  {% endfor %}
  {% else %}
  - No relationship graph available
  {% endif %}

  ## SQL Guidance
  - Prefer canonical fact tables when available.
  - Use relationship graph joins for connected entities.
  - Avoid inventing columns that are not in the metadata.
  - Keep generated SQL aligned with the schema context above.

constraints:
  max_completion_tokens: 0

metadata:
  category: "system"
  audience: "prompt_studio"
