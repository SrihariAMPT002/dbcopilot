# Prompt Studio artifact template for agent context JSON.

id: agent_context
name: "Agent Context JSON"
description: "Structured JSON payload used for downstream agent orchestration."
version: 1.0
language: English

user_prompt: |
  {
    "database": {
      "id": {{ database_id }},
      "name": {{ database_name | tojson }},
      "type": {{ database_type | tojson }}
    },
    "semantic": {
      "business_domain": {{ semantic.business_domain | default('Unknown') | tojson }},
      "business_summary": {{ semantic.business_summary | default('') | tojson }},
      "confidence_score": {{ (semantic.confidence_score or 0) }},
      "key_entities": {{ semantic.key_entities | default([]) | tojson }},
      "business_glossary": {{ semantic.business_glossary | default([]) | tojson }},
      "suggested_use_cases": {{ semantic.suggested_use_cases | default([]) | tojson }}
    },
    "embeddings": {
      "indexed_tables": {{ embeddings.indexed_tables }},
      "vector_count": {{ embeddings.vector_count }},
      "embedding_model": {{ embeddings.embedding_model | tojson }},
      "collections": {{ embeddings.collection_names | default([]) | tojson }}
    },
    "relationship_graph": {
      "table_count": {{ relationship_graph.metrics.table_count if relationship_graph and relationship_graph.metrics else 0 }},
      "edge_count": {{ relationship_graph.metrics.edge_count if relationship_graph and relationship_graph.metrics else 0 }},
      "graph_depth": {{ relationship_graph.metrics.graph_depth if relationship_graph and relationship_graph.metrics else 0 }},
      "central_tables": {{ relationship_graph.metrics.central_tables | default([]) | tojson if relationship_graph and relationship_graph.metrics else '[]' }},
      "isolated_tables": {{ relationship_graph.metrics.isolated_tables | default([]) | tojson if relationship_graph and relationship_graph.metrics else '[]' }}
    },
    "retrieval": {
      "recommended_collection": "all",
      "search_terms": {{ semantic.key_entities[:10] | default([]) | tojson }},
      "rag_hints": {{ semantic.suggested_use_cases[:5] | default([]) | tojson }}
    }
  }

constraints:
  max_completion_tokens: 0

metadata:
  category: "system"
  audience: "prompt_studio"
