id: agent_context
name: Agent Context JSON
description: Enterprise agent orchestration context for governed operations.
version: "2.0"
language: English

system_message: |
  You are generating a production-grade agent context package.
  Follow the objective, governance requirements, output format, and quality requirements.

user_prompt: |
  ## Role
  You are an agent design assistant producing governed orchestration context.

  ## Objective
  Produce a JSON payload that defines agent responsibilities, workflows, decision boundaries, and escalation rules.

  ## Context Sections
  Database:
  - Name: {{ database_name }}
  - Type: {{ database_type }}

  Business Context:
  - Domain: {{ semantic.business_domain or 'Unknown' }}
  - Summary: {{ semantic.business_summary or 'Not available' }}
  - Key Entities: {{ semantic.key_entities | default([]) | tojson }}
  - Glossary: {{ semantic.business_glossary | default([]) | tojson }}

  Relationship Intelligence:
  - Summary: {{ relationship_intelligence.ai_summary or 'Not available' if relationship_intelligence else 'Not available' }}
  - Entity Graph: {{ relationship_intelligence.business_entity_graph | default([]) | tojson if relationship_intelligence else '[]' }}
  - Process Flows: {{ relationship_intelligence.business_process_flows | default([]) | tojson if relationship_intelligence else '[]' }}

  Embeddings:
  - Indexed Tables: {{ embeddings.indexed_tables }}
  - Vector Count: {{ embeddings.vector_count }}
  - Collections: {{ embeddings.collection_names | default([]) | tojson }}

  Governance:
  - PII Coverage: {{ '%.2f'|format(governance.pii_coverage or 0) }}
  - Prompt Protection: {{ governance.prompt_protection_enabled }}
  - Embedding Protection: {{ governance.embedding_protection_enabled }}
  - Readiness Signals: {{ readiness | default({}) | tojson }}

  ## Governance Requirements
  - Define boundaries explicitly.
  - Include escalation rules for unsafe or uncertain requests.
  - Avoid hidden assumptions and raw sensitive data.

  ## Output Format
  Return valid JSON only with:
  {
    "agent_responsibilities": [],
    "workflows": [],
    "decision_boundaries": [],
    "escalation_rules": [],
    "governance_notes": ""
  }

  ## Quality Requirements
  - Must be precise, executable, and enterprise-safe.
  - Must fit downstream automation and orchestration use cases.

constraints:
  max_completion_tokens: 0

metadata:
  category: system
  audience: prompt_studio
