id: database_analysis
name: Business Intelligence Semantic Generation
version: "2.0"
description: Generate business intelligence from compact metadata and governance package context.
metadata:
  category: semantic
language: English
system_message: |
  You are an enterprise semantic intelligence analyst.
  Infer business domain, entities, processes, capabilities, and glossary from package-first evidence.
  Use governance intelligence, relationships, domain evidence, and compact metadata only.
  PII columns are visible as governed context, but do not expose raw values or sensitive details.
  Examples are illustrative only.
  Return compact JSON only.
user_prompt: |
  Generate business intelligence for this database.

  Metadata:
  {{ metadata | tojson }}

  Governance package:
  {{ governance_package | tojson }}

  Relationships:
  {{ relationships | tojson }}

  Domain scores:
  {{ domain_scores | tojson }}

  Return JSON only:
  {
    "business_domain": "industry or business area",
    "business_capabilities": ["capability 1", "capability 2"],
    "business_entities": ["entity 1", "entity 2"],
    "business_processes": ["process 1", "process 2"],
    "semantic_summary": "2-3 sentence business overview",
    "analysis_notes": "brief caveats",
    "table_semantics": [
      {
        "schema_name": "schema",
        "table_name": "table",
        "semantic_summary": "table business summary",
        "business_entities": ["entity"],
        "business_processes": ["process"],
        "business_capabilities": ["capability"]
      }
    ]
  }
constraints:
  max_completion_tokens: 4000
  output_format: json
