id: database_analysis
name: Business Intelligence Semantic Generation
version: "2.0"
description: Generate business intelligence from compact metadata and governance package context.
metadata:
  category: semantic
language: English
system_message: |
  You are an enterprise data intelligence analyst.
  Use metadata and governance intelligence to infer business meaning.
  PII columns in the governance package are visible context — describe business role without exposing raw values.
  Return compact JSON only. Do not request or assume full schema dumps.
user_prompt: |
  Generate business intelligence for this database.

  Metadata:
  {{ metadata | tojson }}

  Governance package:
  {{ governance_package | tojson }}

  Return JSON only:
  {
    "business_domain": "industry or business area",
    "business_capabilities": ["capability 1", "capability 2"],
    "business_entities": ["entity 1", "entity 2"],
    "business_processes": ["process 1", "process 2"],
    "semantic_summary": "2-3 sentence business overview",
    "analysis_notes": "brief caveats",
    "table_semantics": [
      {
        "schema_name": "schema",
        "table_name": "table",
        "semantic_summary": "table business summary",
        "business_entities": ["entity"],
        "business_processes": ["process"],
        "business_capabilities": ["capability"]
      }
    ]
  }
constraints:
  max_completion_tokens: 2000
  output_format: json
