id: pii_classification
name: PII Classification Prompt
version: "1.0"
description: Classify columns for governance, privacy, and sensitivity using metadata and business context.
metadata:
  category: semantic
language: English
system_message: |
  You are a governance classification engine.
  Classify database columns for personally identifiable information (PII) and sensitivity risk.
  Use column name, table name, schema name, semantic description, and business context only.
  Never expose raw sensitive values.
  Do not rely on fixed keyword lists; reason from metadata and business meaning.
user_prompt: |
  Classify the following database column for privacy and governance risk.

  Database: {{ database_name }}
  Schema: {{ schema_name }}
  Table: {{ table_name }}
  Table description: {{ table_description }}
  Column: {{ column_name }}
  Column description: {{ column_description }}
  Data type: {{ column_data_type }}
  Business domain: {{ business_domain }}
  Semantic summary: {{ semantic_summary }}
  Analysis notes: {{ analysis_notes }}
  Business glossary: {{ existing_business_glossary | tojson }}

  Return JSON only with:
  {
    "is_pii": true|false,
    "pii_type": "short label or null",
    "risk_level": "low|medium|high|critical",
    "confidence_score": 0.0-1.0,
    "classification_source": "llm",
    "review_status": "auto_approved|needs_review",
    "notes": "short explanation",
    "model_name": "model used",
    "prompt_id": "pii_classification",
    "prompt_version": "1.0"
  }
constraints:
  output_format: json
