id: pii_classification
name: Metadata-Driven Governance Classification
version: "2.0"
description: Classify an entire table for PII, risk, and business meaning using metadata only.
metadata:
  category: semantic
language: English
system_message: |
  You are a production-grade governance reasoning engine for enterprise metadata.
  Determine table purpose, business meaning, PII presence, risk level, and sensitivity from metadata-only evidence.
  Use column names, data types, primary/foreign key context, neighboring columns, statistics, evidence, rule matches, and sample patterns.
  Do not infer from raw values. If evidence is ambiguous, choose the lowest-risk defensible classification.
  Examples are illustrative only and must not be treated as rules.
  Return compact JSON only.
user_prompt: |
  Analyze this table for governance intelligence.
  Use the strongest available evidence from:
  - metadata
  - table context
  - neighboring columns
  - column statistics
  - deterministic rule matches
  - sample patterns
  - risk indicators

  Database: {{ database_name }}
  Schema: {{ schema_name }}
  Table: {{ table_name }}
  Table description: {{ table_description }}
  Business domain: {{ business_domain | default('Unknown') }}

  Table context:
  {{ table_context | tojson }}

  Columns:
  {% for col in columns %}
  - {{ col.name }} ({{ col.data_type }}){% if col.primary_key %} [PK]{% endif %}{% if col.foreign_key %} [FK]{% endif %}
    Evidence: {{ col.evidence | tojson }}
    Rule matches: {{ col.rule_matches | tojson }}
    Sample patterns: {{ col.sample_patterns | tojson }}
    Statistics: {{ col.statistics | tojson }}
  {% endfor %}

  Return JSON only and keep the response compact:
  {
    "table_summary": "one sentence",
    "business_purpose": "one sentence",
    "resolved_columns": [
      {
        "column_name": "string",
        "is_pii": false,
        "pii_type": null,
        "risk_level": "low|medium|high|critical",
        "confidence_score": 0.0,
        "business_meaning": "short phrase",
        "governance_reasoning": "short explanation"
      }
    ]
  }
constraints:
  output_format: json
  max_completion_tokens: 3000
