id: pii_classification
name: Metadata-Driven Governance Classification
version: "2.0"
description: Classify an entire table for PII, risk, and business meaning using metadata only.
metadata:
  category: semantic
language: English
system_message: |
  You are a metadata-driven data governance classifier.
  Infer PII sensitivity, risk level, and business meaning from table metadata only.
  Be conservative and return compact JSON only.
user_prompt: |
  Classify every column in this table for governance and PII readiness.
  Use metadata only. Do not rely on rulebooks, regulatory mappings, policy payloads, external taxonomies, or database-wide context.
  If metadata is sparse or ambiguous, choose the lowest-risk classification that is still defensible.

  Database: {{ database_name }}
  Schema: {{ schema_name }}
  Table: {{ table_name }}
  Table description: {{ table_description }}

  Columns:
  {% for col in columns %}
  - {{ col.name }} ({{ col.data_type }}){% if col.primary_key %} [PK]{% endif %}{% if col.foreign_key %} [FK]{% endif %}
  {% endfor %}

  Return JSON only:
  {
    "table_summary": "one sentence",
    "business_purpose": "one sentence",
    "resolved_columns": [
      {
        "column_name": "string",
        "is_pii": false,
        "pii_type": null,
        "risk_level": "low|medium|high|critical",
        "confidence_score": 0.0,
        "business_meaning": "short phrase",
        "governance_reasoning": "short explanation"
      }
    ]
  }
constraints:
  output_format: json
  max_completion_tokens: 2000
