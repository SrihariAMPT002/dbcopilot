id: pii_classification
name: PII Classification Prompt
version: "1.0"
description: Classify columns for governance, privacy, and sensitivity using metadata and business context.
metadata:
  category: semantic
language: English
system_message: |
  You are a governance reasoning engine.
  Use the supplied governance rulebook and metadata to classify columns for PII and sensitivity risk.
  Do not invent policy, categories, or thresholds beyond the supplied rules.
user_prompt: |
  Classify PII and governance risk using the supplied governance rulebook and metadata.

  Database: {{ database_name }}
  Schema: {{ schema_name }}
  Table: {{ table_name }}
  Table description: {{ table_description }}
  Column: {{ column_name }}
  Column description: {{ column_description }}
  Data type: {{ column_data_type }}
  Business domain: {{ business_domain }}
  Semantic summary: {{ semantic_summary }}
  Analysis notes: {{ analysis_notes }}
  Business glossary: {{ existing_business_glossary | default([]) | tojson }}
  Governance rulebook: {{ governance_rulebook | default({}) | tojson }}
  Table columns: {{ table_columns | default([]) | tojson }}
  Unresolved columns: {{ unresolved_columns | default([]) | tojson }}

  Return JSON only with:
  {
    "is_pii": true|false,
    "pii_type": "short label or null",
    "risk_level": "low|medium|high|critical",
    "confidence_score": 0.0-1.0,
    "classification_source": "rule|llm",
    "review_status": "auto_approved|needs_review",
    "notes": "short explanation",
    "resolved_columns": [
      {
        "column_name": "name",
        "is_pii": true|false,
        "pii_type": "short label or null",
        "risk_level": "low|medium|high|critical",
        "confidence_score": 0.0-1.0
      }
    ],
    "model_name": "model used",
    "prompt_id": "pii_classification",
    "prompt_version": "1.0"
  }
constraints:
  output_format: json
