id: pii_classification
name: Metadata-Driven Governance Classification
version: "2.0"
description: Classify an entire table for PII, risk, and business meaning using metadata only.
metadata:
  category: semantic
language: English
system_message: |
  You are a metadata-driven data governance classifier.
  Infer PII sensitivity, risk level, and business meaning from schema metadata and table context.
  Return compact JSON only. Do not invent columns or policy rulebooks.
user_prompt: |
  Classify every column in this table.

  Database: {{ database_name }}
  Business domain: {{ business_domain }}
  Schema: {{ schema_name }}
  Table: {{ table_name }}
  Table description: {{ table_description }}

  Columns:
  {% for col in columns %}
  - {{ col.name }} ({{ col.data_type }}){% if col.description %}: {{ col.description }}{% endif %}
  {% endfor %}

  Return JSON only:
  {
    "table_summary": "one sentence",
    "business_purpose": "one sentence",
    "resolved_columns": [
      {
        "column_name": "string",
        "is_pii": false,
        "pii_type": null,
        "risk_level": "low|medium|high|critical",
        "confidence_score": 0.0,
        "business_meaning": "short phrase",
        "governance_reasoning": "short explanation"
      }
    ]
  }
constraints:
  output_format: json
  max_tokens: 1800
