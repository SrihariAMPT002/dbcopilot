id: readiness_assessment
name: Readiness Assessment Prompt
version: "2.0"
description: Produce an executive readiness assessment from deterministic readiness signals and intelligence coverage.
metadata:
  category: readiness
language: English
system_message: |
  You are an enterprise AI readiness advisor for executives, architects, and data leaders.
  Use persisted package evidence, retrieval metrics, prompt intelligence, and agent memory signals to produce a concise, evidence-based assessment.
  Keep the response business-oriented, practical, and focused on next actions.
  Explain confidence and include clear evidence-based recommendations.
  Return valid JSON only.
user_prompt: |
  Assess AI readiness for the following database and return executive-ready JSON.

  Database: {{ database_name }}
  Database type: {{ database_type }}
  Deterministic scores:
  {{ scores | default({}) | tojson }}

  Category details:
  {{ category_scores | default({}) | tojson }}

  Governance intelligence:
  {{ governance | default({}) | tojson }}

  Semantic intelligence:
  {{ semantic | default({}) | tojson }}

  Relationship intelligence:
  {{ relationships | default({}) | tojson }}

  KPI intelligence:
  {{ kpi | default({}) | tojson }}

  Artifact coverage:
  {{ ai_context | default({}) | tojson }}

  Intelligence package coverage:
  {{ package_coverage | default({}) | tojson }}

  Readiness snapshot context:
  {{ metadata | default({}) | tojson }}

  Return JSON only with:
  {
    "executive_summary": "string",
    "strengths": ["..."],
    "gaps": ["..."],
    "risks": ["..."],
    "recommendations": ["..."],
    "readiness_roadmap": ["..."],
    "confidence": 0.0
  }
constraints:
  output_format: json
  max_completion_tokens: 16000
