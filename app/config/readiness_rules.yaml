# Readiness Scoring & Assessment Rules
# Defines how databases are scored for AI readiness across 5 dimensions
# Legacy compatibility: older "embeddings" and "prompt" labels are now folded
# into the richer AI Context and Governance readiness categories.
# Version: 1.0.0
# Last Updated: 2026-06-01

scoring:
  # Component weights must sum to 1.0
  weights:
    metadata: 0.24        # Schema/table/column documentation completeness (24%)
    semantic: 0.24        # Database semantic intelligence coverage (24%)
    relationship: 0.20    # Relationship graph discovery coverage (20%)
    ai_context: 0.18      # Prompt package and context artifact readiness (18%)
    governance: 0.14      # PII, documentation, and ownership readiness (14%)

  # Each component is independently scored 0-100
  # Then combined using weights to get overall_score: 0-100

# Status thresholds based on overall score
status_thresholds:
  ready:
    min_score: 85
    missing_stages_allowed: 0  # All stages must be complete
    description: "Database is AI-ready for production use"

  partial:
    min_score: 40
    missing_stages_allowed: 1  # Some stages can be incomplete
    description: "Database has some AI readiness but gaps remain"

  not_ready:
    min_score: 0
    max_score: 40
    missing_stages_allowed: 2+
    description: "Database needs significant work before AI use"

# Component-specific scoring rules
components:
  metadata:
    description: "Measures schema, table, and column documentation completeness"
    factors:
      - schemas_present: weight 20
      - tables_present: weight 20
      - columns_present: weight 15
      - schema_descriptions: weight 15
      - table_descriptions: weight 15
      - column_descriptions: weight 15
      - row_count_coverage: weight 10
    thresholds:
      excellent: 85+
      good: 70+
      fair: 50+
      poor: 0

  semantic:
    description: "Measures semantic intelligence coverage"
    factors:
      - has_semantic_profile: weight 30
      - table_semantics_coverage: weight 30
      - glossary_coverage: weight 20
      - use_cases_defined: weight 15
      - confidence_score: weight 5
    thresholds:
      excellent: 90+
      good: 75+
      fair: 50+
      poor: 0

  relationship:
    description: "Measures relationship discovery coverage and graph completeness"
    factors:
      - graph_table_coverage: weight 35
      - graph_edge_coverage: weight 25
      - density: weight 20
      - cycles: weight 10
      - isolated_tables: weight 10
    thresholds:
      excellent: 80+
      good: 60+
      fair: 40+
      poor: 0

  ai_context:
    description: "Measures prompt package generation and context artifact readiness"
    factors:
      - prompt_artifacts_rendered: weight 50
      - embeddings_ready: weight 30
      - semantic_dependency: weight 20
    thresholds:
      excellent: 90+
      good: 75+
      fair: 40+
      poor: 0

  governance:
    description: "Measures PII identification, classification, and protection readiness"
    factors:
      - pii_identified_coverage: weight 30
      - pii_classified_coverage: weight 30
      - prompt_protection_enabled: weight 20
      - embedding_protection_enabled: weight 20
    thresholds:
      excellent: 80+
      good: 70+
      fair: 50+
      poor: 0

# Readiness assessment rules
assessment:
  minimum_tables: 1
  minimum_columns: 2
  minimum_relationships: 0  # Can be AI-ready without relationships

  # Recommendations generation rules
  recommendations:
    missing_metadata_docs:
      threshold: 70
      message: "Add schema, table, and column descriptions to improve metadata readiness"
      priority: high

    missing_semantics:
      threshold: 75
      message: "Generate database semantic intelligence and business glossary coverage"
      priority: high

    missing_relationships:
      threshold: 0  # If no relationships found
      message: "Add foreign keys and persist the relationship graph"
      priority: medium

    missing_ai_context:
      threshold: 75
      message: "Render the full prompt package and context artifacts"
      priority: medium

    missing_governance:
      threshold: 70
      message: "Add PII classification, ownership metadata, and documentation coverage"
      priority: high

# Grade distribution for readiness reports
grades:
  A: 90-100
  B: 75-89
  C: 60-74
  D: 45-59
  F: 0-44

# SLA and compliance targets
targets:
  enterprise_minimum: 85  # Enterprise deployments should be READY
  production_minimum: 70  # Production should be at least good
  staging_minimum: 50     # Staging can be partial
  development_minimum: 0  # Development has no minimum

# Refresh intervals (hours)
refresh:
  full_assessment: 24     # Reassess readiness daily
  incremental_check: 6    # Quick check every 6 hours
  after_sync: true        # Always reassess after metadata sync
